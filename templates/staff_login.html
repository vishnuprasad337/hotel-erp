<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6f9;
  --white:#ffffff;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --text:#111827;
  --muted:#6b7280;
  --muted2:#9ca3af;
  --border:#e5e7eb;
  --border2:#d1d5db;
}
html,body{height:100%}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}

/* animated blobs */
.blob{
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
  z-index:0;
  opacity:.55;
}
.blob1{width:420px;height:420px;background:#bfdbfe;top:-100px;left:-100px;animation:drift1 12s ease-in-out infinite}
.blob2{width:340px;height:340px;background:#ddd6fe;bottom:-80px;right:-80px;animation:drift2 14s ease-in-out infinite}
.blob3{width:260px;height:260px;background:#bbf7d0;top:40%;right:10%;animation:drift3 10s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}

.wrap{
  width:100%;max-width:430px;
  position:relative;z-index:1;
  animation:up .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* back link above card */
.back{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;
  margin-bottom:14px;
  transition:color .2s;
}
.back:hover{color:var(--text)}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.card{
  background:var(--white);
  border-radius:22px;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 4px 6px rgba(0,0,0,.04),0 20px 50px rgba(0,0,0,.08);
  overflow:hidden;
}

/* header band */
.card-head{
  padding:30px 32px 26px;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%);
  position:relative;
  overflow:hidden;
}
/* decorative circles */
.card-head::before{
  content:'';position:absolute;
  width:200px;height:200px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  top:-70px;right:-50px;
}
.card-head::after{
  content:'';position:absolute;
  width:120px;height:120px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  bottom:-40px;left:20px;
}
.head-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
  position:relative;z-index:1;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:5px 11px;
  font-size:11px;color:rgba(255,255,255,.85);
  letter-spacing:.06em;text-transform:uppercase;font-weight:500;
}
.badge .dot{
  width:6px;height:6px;
  background:#4ade80;border-radius:50%;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.time-txt{font-size:12px;color:rgba(255,255,255,.6)}

.icon-wrap{
  width:52px;height:52px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
  position:relative;z-index:1;
}
.icon-wrap svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-head h1{
  font-size:1.6rem;font-weight:700;color:#fff;
  letter-spacing:-.02em;line-height:1.25;
  margin-bottom:5px;
  position:relative;z-index:1;
}
.card-head p{
  font-size:13px;color:rgba(255,255,255,.65);font-weight:300;
  position:relative;z-index:1;
}

/* body */
.card-body{padding:28px 32px 30px}

.alert{
  display:flex;align-items:flex-start;gap:9px;
  padding:12px 14px;border-radius:11px;
  font-size:13px;margin-bottom:20px;
  animation:shake .3s ease;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.alert-error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.alert-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
.alert svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;margin-top:1px}

/* fields */
.field{margin-bottom:17px}
.field-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lbl{
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);
}
.field-link{font-size:12px;color:var(--blue);text-decoration:none;font-weight:500}
.field-link:hover{text-decoration:underline}

.inp-wrap{position:relative}
.inp-wrap input{
  width:100%;
  padding:11px 40px 11px 38px;
  border:1.5px solid var(--border);
  border-radius:11px;
  font-size:14px;font-family:'Outfit',sans-serif;
  color:var(--text);background:var(--white);
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
  -webkit-appearance:none;
}
.inp-wrap input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
  background:#fafcff;
}
.inp-wrap input::placeholder{color:var(--muted2);font-weight:300}
.inp-ico{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted2);
  transition:color .2s;
}
.inp-wrap input:focus ~ .inp-ico{color:var(--blue)}
.inp-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--muted2);padding:3px;
  transition:color .2s;
}
.eye-btn:hover{color:var(--muted)}
.eye-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* strength */
.strength{margin-top:6px;display:none}
.strength.on{display:block}
.s-track{height:3px;background:var(--border);border-radius:3px;overflow:hidden}
.s-bar{height:100%;width:0;border-radius:3px;transition:width .3s,background .3s}
.s-lbl{font-size:11px;color:var(--muted2);margin-top:3px}

/* remember row */
.opt-row{display:flex;align-items:center;margin:8px 0 22px}
.chk-label{
  display:flex;align-items:center;gap:7px;
  font-size:13px;color:var(--muted);cursor:pointer;
}
.chk-label input{
  appearance:none;width:16px;height:16px;
  border:1.5px solid var(--border2);border-radius:5px;cursor:pointer;
  position:relative;flex-shrink:0;transition:all .2s;
}
.chk-label input:checked{background:var(--blue);border-color:var(--blue)}
.chk-label input:checked::after{
  content:'';position:absolute;left:4px;top:1px;
  width:5px;height:9px;
  border:2px solid #fff;border-top:none;border-left:none;
  transform:rotate(45deg);
}

/* submit */
.btn{
  width:100%;padding:13px;
  background:var(--blue);color:#fff;
  border:none;border-radius:11px;
  font-size:15px;font-weight:600;font-family:'Outfit',sans-serif;
  cursor:pointer;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:background .2s,transform .1s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.06));
}
.btn:hover{background:var(--blue-dark);box-shadow:0 6px 20px rgba(37,99,235,.35)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .6s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* footer */
.card-foot{
  padding:15px 32px;
  border-top:1px solid var(--border);
  background:#fafafa;
  text-align:center;
  font-size:12px;color:var(--muted2);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.card-foot svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

@media(max-width:480px){
  .card-head,.card-body{padding-left:22px;padding-right:22px}
  .card-foot{padding-left:22px;padding-right:22px}
  .card-head h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="wrap">
  <a href="/" class="back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to home
  </a>

  <div class="card">
    <!-- Header -->
    <div class="card-head">
      <div class="head-top">
        <div class="badge"><span class="dot"></span> Staff Portal</div>
        <span class="time-txt" id="clock"></span>
      </div>
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h1>Welcome back 👋</h1>
      <p>Sign in to access your dashboard</p>
    </div>

    <!-- Body -->
    <div class="card-body">

      {% if error %}
      <div class="alert alert-error">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if success %}
      <div class="alert alert-success">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span>{{ success }}</span>
      </div>
      {% endif %}

      <form method="POST" id="loginForm">
        {% csrf_token %}

        <div class="field">
          <div class="field-row"><span class="lbl">Email address</span></div>
          <div class="inp-wrap">
            <input type="email" name="email" placeholder="staff@company.com"
              autocomplete="email" required value="{{ request.POST.email|default:'' }}">
            <span class="inp-ico">
              <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <div class="field-row">
            <span class="lbl">Password</span>
            <a href="/password-reset/" class="field-link">Forgot password?</a>
          </div>
          <div class="inp-wrap">
            <input type="password" id="pwd" name="password"
              placeholder="Enter your password"
              autocomplete="current-password" required>
            <span class="inp-ico">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show/hide password">
              <svg id="eyeIco" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength" id="strengthBox">
            <div class="s-track"><div class="s-bar" id="sBar"></div></div>
            <div class="s-lbl" id="sLbl"></div>
          </div>
        </div>

        <div class="opt-row">
          <label class="chk-label">
            <input type="checkbox" name="remember">
            Keep me signed in
          </label>
        </div>

        <button type="submit" class="btn" id="loginBtn">
          Sign In
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="card-foot">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Secure portal &nbsp;·&nbsp; Contact admin for credentials
    </div>
  </div>
</div>

<script>
// Clock
(function tick(){
  const n=new Date();
  const el=document.getElementById('clock');
  if(el) el.textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
  setTimeout(tick,1000);
})();

// Eye toggle
const eyeBtn=document.getElementById('eyeBtn');
const pwd=document.getElementById('pwd');
eyeBtn.addEventListener('click',function(){
  const show=pwd.type==='password';
  pwd.type=show?'text':'password';
  document.getElementById('eyeIco').innerHTML=show
    ?'<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    :'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

// Password strength
pwd.addEventListener('input',function(){
  const v=this.value;
  const box=document.getElementById('strengthBox');
  const bar=document.getElementById('sBar');
  const lbl=document.getElementById('sLbl');
  if(!v){box.classList.remove('on');return;}
  box.classList.add('on');
  let s=0;
  if(v.length>=8)s++;
  if(/[A-Z]/.test(v))s++;
  if(/[0-9]/.test(v))s++;
  if(/[^A-Za-z0-9]/.test(v))s++;
  const lvl=[
    {w:'25%',bg:'#ef4444',t:'Weak password'},
    {w:'50%',bg:'#f59e0b',t:'Fair password'},
    {w:'75%',bg:'#3b82f6',t:'Good password'},
    {w:'100%',bg:'#22c55e',t:'Strong password'}
  ][s-1]||{w:'25%',bg:'#ef4444',t:'Weak password'};
  bar.style.width=lvl.w;bar.style.background=lvl.bg;lbl.textContent=lvl.t;
});

// Form submit
document.getElementById('loginForm').addEventListener('submit',function(e){
  if(this.checkValidity()){
    const btn=document.getElementById('loginBtn');
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> Signing in...';
  }
});

// Auto-dismiss alerts
document.querySelectorAll('.alert').forEach(function(el){
  setTimeout(function(){
    el.style.transition='opacity .4s';
    el.style.opacity='0';
    setTimeout(function(){el.remove()},400);
  },5000);
});
</script>
</body>
</html>
